<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>🌙 ルナガチャ Prototype 1.2</title>
<style>
*{box-sizing:border-box}
body{margin:0;color:#f5f7ff;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;background:radial-gradient(circle at 50% -10%,#354577,#0b1124 48%,#050812);min-height:100vh}
.app{width:min(920px,100%);margin:auto;padding:18px}
header{text-align:center;margin-bottom:14px}
h1{margin:0;font-size:30px}.sub{color:#aeb8d4;font-size:13px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 15px;border:1px solid #3b496d;border-radius:15px;background:#121a30;margin-bottom:12px}
.crystal{font-weight:900}.status{color:#aeb8d4;font-size:12px;text-align:right}
.stage{border:1px solid #3b496d;border-radius:23px;background:linear-gradient(180deg,#172342,#0c1428);padding:24px 16px;min-height:430px;box-shadow:inset 0 0 100px #5d73c018}
.moon{width:110px;height:110px;border-radius:50%;margin:0 auto 17px;background:radial-gradient(circle at 35% 30%,#fff,#e4ebff 48%,#a7b4d7);box-shadow:0 0 35px #dce5ffbb,0 0 90px #91a4ff44}
.message{text-align:center;font-weight:900;min-height:25px}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0}
button{font:inherit}.action{border:1px solid #5c6e9d;background:#26365f;color:#fff;border-radius:999px;padding:11px 23px;font-weight:900;cursor:pointer}
.action:hover:not(:disabled){filter:brightness(1.12)}.action:disabled{opacity:.45;cursor:not-allowed}
.single{display:none;max-width:300px;margin:20px auto 0}.single.show{display:block}
.card{border-radius:17px;border:1px solid #53658f;background:#11192d;padding:10px;min-height:340px}
.art{height:250px;border-radius:12px;background:radial-gradient(circle at 78% 17%,#f3f5ff 0 6%,transparent 7%),linear-gradient(145deg,#929fc7,#2a3555);position:relative;overflow:hidden}
.face{position:absolute;width:62px;height:62px;border-radius:50%;background:#eee9e3;left:50%;top:34%;transform:translate(-50%,-50%)}
.body{position:absolute;width:92px;height:90px;border-radius:48% 48% 36% 36%;background:#505666;left:50%;top:53%;transform:translateX(-50%)}
.ear1,.ear2{position:absolute;z-index:2;top:20%;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:25px solid #505666}
.ear1{left:calc(50% - 42px)}.ear2{left:calc(50% + 14px)}
.cardinfo{text-align:center;padding-top:9px}.rarity{font-size:12px;font-weight:1000;letter-spacing:.14em}.name{font-size:19px;font-weight:1000;margin:2px}.quote{font-size:12px;color:#cbd3e8}
.collection{margin-top:15px;border:1px solid #3b496d;border-radius:18px;background:#10182b;padding:15px}
.collection h2{font-size:17px;margin:0 0 10px}.rarities{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.badge{padding:9px 5px;text-align:center;border-radius:10px;background:#18213a;border:1px solid #364566;font-size:11px}.badge b{display:block;font-size:16px}
.history{margin-top:12px;color:#aeb8d4;font-size:12px;line-height:1.7}
@media(max-width:520px){.app{padding:10px}h1{font-size:24px}.stage{padding:20px 12px}.rarities{grid-template-columns:repeat(3,1fr)}.top{align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">
<header><h1>🌙 ルナガチャ</h1><div class="sub">Prototype 1.2 — ガチャ基礎版</div></header>

<div class="top">
  <div class="crystal">💎 月晶石：<span id="stone">100</span></div>
  <div class="status">1回：10個　／　10連：100個<br><span id="pulls">召喚回数：0</span></div>
</div>

<section class="stage">
  <div class="moon"></div>
  <div class="message" id="message">月は静かに、あなたを待っている。</div>
  <div class="single" id="single"></div>
</section>

<div class="actions">
  <button class="action" id="one">🌙 1回召喚</button>
  <button class="action" id="ten">✨ 10連召喚</button>
</div>

<section class="collection">
<h2>📖 ルナ図鑑</h2>
<div class="rarities" id="rarities"></div>
<div class="history" id="history">まだ召喚履歴はありません。</div>
</section>
</div>

<script>
"use strict";
const pool=[
 {r:"UR",n:"ルナ【月を想う】",q:"……あなた、来てくれたんだ"},
 {r:"SSR",n:"ルナ【星降る夜】",q:"……別に、嬉しくないけど"},
 {r:"SSR",n:"ルナ【月と、どこまでも】",q:"きっと、また会えるよ"},
 {r:"SR",n:"ルナ【風の音】",q:"……なんか、落ち着く"},
 {r:"SR",n:"ルナ【お勉強中】",q:"……やればできる、たぶん"},
 {r:"R",n:"ルナ【夜さんぽ】",q:"月、きれいじゃん"},
 {r:"R",n:"ルナ【ネコ発見】",q:"……いた"},
 {r:"N",n:"ルナ【ねむい】",q:"……あと5分……"},
 {r:"N",n:"ルナ【通常運転】",q:"まあ、なんとかなるっしょ"}
];
const weights=[["UR",1],["SSR",5],["SR",14],["R",30],["N",50]];
const owned={N:new Set(),R:new Set(),SR:new Set(),SSR:new Set(),UR:new Set()};
let stones=100, totalPulls=0, history=[];

const $=id=>document.getElementById(id);

function rarity(){
 let x=Math.random()*100;
 for(const [r,w] of weights){x-=w;if(x<0)return r}
 return "N";
}
function pick(r){
 const a=pool.filter(x=>x.r===r);
 return a[Math.floor(Math.random()*a.length)];
}
function draw(){
 const r=rarity(), c=pick(r);
 return c;
}
function renderCard(c){
 const s=$("single");s.className="single show";
 s.innerHTML='<div class="card"><div class="art"><div class="face"></div><div class="body"></div><div class="ear1"></div><div class="ear2"></div></div>'+
 '<div class="cardinfo"><div class="rarity">★ '+c.r+'</div><div class="name">'+c.n+'</div><div class="quote">「'+c.q+'」</div></div></div>';
}
function addHistory(list){
 history.unshift(...list);
 history=history.slice(0,12);
 $("history").innerHTML=history.map((c,i)=>(i+1)+"． <b>"+c.r+"</b> "+c.n).join("<br>");
}
function updateBook(){
 $("rarities").innerHTML=["N","R","SR","SSR","UR"].map(r=>
   '<div class="badge"><b>'+owned[r].size+'</b>'+r+'<br><span>所持</span></div>').join("");
}
function use(n){
 if(stones<n){$("message").textContent="月晶石が足りない……";return false}
 stones-=n;$("stone").textContent=stones;return true;
}
function onePull(){
 if(!use(10))return;
 totalPulls++;$("pulls").textContent="召喚回数："+totalPulls;
 const c=draw();owned[c.r].add(c.n);addHistory([c]);renderCard(c);
 $("message").textContent=c.r==="UR"?"――月が、応えた。":c.r+" のルナが現れた。";
 updateBook();
}
function tenPull(){
 if(!use(100))return;
 totalPulls+=10;$("pulls").textContent="召喚回数："+totalPulls;
 const list=Array.from({length:10},draw);
 list.forEach(c=>owned[c.r].add(c.n));addHistory(list);
 const best=["UR","SSR","SR","R","N"].find(r=>list.some(c=>c.r===r));
 const c=list.find(x=>x.r===best);
 renderCard(c);
 $("message").textContent=best==="UR"?"――月が、応えた。":best+"以上のルナを召喚した！";
 updateBook();
}
$("one").onclick=onePull;$("ten").onclick=tenPull;updateBook();
</script>
</body>
</html>
