<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c1d">
<title>🌙 ルナガチャ Prototype 3.7</title>
<style>
*{box-sizing:border-box}
body{margin:0;color:#f5f7ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#43558d,#0b1124 46%,#050812);min-height:100vh}
.app{width:min(900px,100%);margin:auto;padding:14px}
header{text-align:center;margin-bottom:12px}h1{margin:0;font-size:29px}.sub{color:#aeb8d4;font-size:13px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border:1px solid #3b496d;border-radius:16px;background:#11192d;margin-bottom:12px}.crystal{font-weight:900;font-size:20px}.status{color:#b1bad2;font-size:12px;text-align:right}
.stage{position:relative;overflow:hidden;border:1px solid #3b496d;border-radius:23px;background:linear-gradient(180deg,#172342,#0c1428);padding:24px 14px;min-height:500px;box-shadow:inset 0 0 120px #7187d018;transition:.3s}
.stage.rSR{box-shadow:inset 0 0 170px #b78cff45}.stage.rSSR{box-shadow:inset 0 0 190px #ff9eea55}.stage.rUR{box-shadow:inset 0 0 240px #fff3a866,0 0 40px #fff3a833}
.moon{width:112px;height:112px;border-radius:50%;margin:8px auto 18px;background:radial-gradient(circle at 35% 30%,#fff,#e5ebff 48%,#a8b5d8);box-shadow:0 0 38px #e0e8ffbb,0 0 90px #8ea3ff44;transition:.35s}.moon:after{content:"";display:block;width:18px;height:18px;border-radius:50%;position:relative;left:25px;top:30px;background:#c5cce0;opacity:.45;box-shadow:43px 34px 0 -4px #c5cce0}
.stage.rSR .moon{box-shadow:0 0 60px #d1a5ff,0 0 150px #a967ff77;transform:scale(1.08)}.stage.rSSR .moon{box-shadow:0 0 80px #ffd2ef,0 0 190px #ff70c477;transform:scale(1.18)}.stage.rUR .moon{box-shadow:0 0 100px #fff,0 0 240px #fff0a8cc;transform:scale(1.28)}
.message{text-align:center;font-weight:1000;font-size:20px;min-height:30px}.hint{text-align:center;color:#9faaca;font-size:12px;margin-top:7px;min-height:18px}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}.action{border:1px solid #6074a7;background:#283a69;color:#fff;border-radius:999px;padding:12px 23px;font-weight:900;font-size:16px;cursor:pointer;touch-action:manipulation}.action:disabled{opacity:.45}.dev{display:block;margin:0 auto;border:0;background:transparent;color:#7180a5;font-size:11px;padding:6px 12px;cursor:pointer}
.tenPanel{display:none;position:relative;z-index:2;margin-top:17px}.tenPanel.show{display:block}.tenTitle{text-align:center;font-weight:1000;font-size:18px;margin-bottom:11px}.cardsGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.miniCard{width:100%;min-width:0;min-height:176px;position:relative;border:1px solid #536792;border-radius:16px;background:#16213b;color:#fff;padding:10px;overflow:hidden;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none;box-shadow:0 6px 18px #0004;transition:transform .18s,box-shadow .18s,background .18s;font:inherit}
.miniCard:active{transform:scale(.97)}.miniCard.open{background:#202e4d;box-shadow:0 0 22px #91aaff22}
.cardBack,.cardFront{width:100%;height:100%;min-height:154px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:4px}
.backMoon{font-size:34px;filter:drop-shadow(0 0 12px #9db5ff)}.backLabel{font-size:11px;color:#aeb9d5;margin-top:7px}
.miniArt{width:76px;height:76px;border-radius:12px;background:linear-gradient(145deg,#9aa7ca,#354362);position:relative;margin-bottom:6px}.miniArt:before{content:"";position:absolute;width:25px;height:25px;border-radius:50%;background:#eee9e3;left:50%;top:22%;transform:translateX(-50%)}.miniArt:after{content:"";position:absolute;width:39px;height:36px;border-radius:45% 45% 30% 30%;background:#505666;left:50%;top:48%;transform:translateX(-50%)}
.miniR{font-size:12px;font-weight:1000;letter-spacing:.1em}.miniName{font-size:12px;font-weight:900;text-align:center;line-height:1.25}
.upgrade{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;background:#fff0}.upgrade.show{animation:upgrade .95s ease}.upgrade span{font-size:27px;font-weight:1000;text-shadow:0 0 16px #fff,0 0 34px #d8baff}
@keyframes upgrade{0%{opacity:0;transform:scale(.55)}22%{opacity:1;transform:scale(1.12)}62%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
.miniCard.promoted{animation:promoted .75s ease}.miniCard.promoted .cardFront{filter:brightness(1.35);}.miniCard.rUR .cardFront{box-shadow:inset 0 0 40px #fff5}
@keyframes promoted{0%,100%{transform:scale(1)}30%{transform:scale(1.05)}60%{transform:scale(1)}}
.note{text-align:center;color:#8f9cbc;font-size:11px;line-height:1.5;margin-top:11px}
.collection{margin-top:14px;border:1px solid #3b496d;border-radius:18px;background:#10182b;padding:14px}.collection h2{font-size:17px;margin:0 0 10px}.rarities{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.badge{text-align:center;background:#18223a;border:1px solid #364666;border-radius:10px;padding:8px 3px;font-size:10px}.badge b{display:block;font-size:16px}.history{margin-top:11px;color:#aeb8d4;font-size:11px;line-height:1.7}
.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#050817dd;backdrop-filter:blur(5px)}.overlay.show{display:flex}.summonText{text-align:center;font-weight:1000;font-size:25px;text-shadow:0 0 25px #fff}.summonText small{display:block;font-size:12px;color:#b8c1db;margin-top:8px}
@keyframes flash{0%,100%{filter:brightness(1)}35%{filter:brightness(2)}}
.stage.flash{animation:flash .5s ease}.stage.shake{animation:shake .45s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@media(max-width:520px){.app{padding:10px}.top{align-items:flex-start}.crystal{font-size:18px}.stage{min-height:470px;padding:20px 10px}.cardsGrid{gap:8px}.miniCard{min-height:164px}.rarities{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="overlay" id="overlay"><div class="summonText" id="summonText"></div></div>
<div class="app">
<header><h1>🌙 ルナガチャ</h1><div class="sub">Prototype 3.7 — 10連カードめくり＋昇格演出</div></header>
<div class="top"><div class="crystal">💎 月晶石：<span id="stone">100</span></div><div class="status">1回：10個　／　10連：100個<br><span id="pulls">召喚回数：0</span></div></div>

<section class="stage" id="stage">
<div class="moon" id="moon"></div>
<div class="message" id="message">月は静かに、あなたを待っている。</div>
<div class="hint" id="hint">10連では、カードを1枚ずつめくれます。</div>
<div class="tenPanel" id="tenPanel">
<div class="tenTitle">🎴 今回の10枚　— タップして開封 —</div>
<div class="cardsGrid" id="cardsGrid"></div>
<div class="note">SR以上が当選している10連は、約50%で事前確定演出。<br>確定演出がない場合は、当選カードの開封時に昇格します。</div>
</div>
</section>

<div class="actions"><button class="action" id="one">🌙 1回召喚</button><button class="action" id="ten">✨ 10連召喚</button></div>
<button class="dev" id="recharge">［テスト］月晶石を＋100</button>
<section class="collection"><h2>📖 ルナ図鑑</h2><div class="rarities" id="rarities"></div><div class="history" id="history">まだ召喚履歴はありません。</div></section>
</div>

<script>
"use strict";
const pool=[
{r:"UR",n:"ルナ【月を想う】",q:"……あなた、来てくれたんだ"},
{r:"SSR",n:"ルナ【星降る夜】",q:"……別に、嬉しくないけど"},
{r:"SSR",n:"ルナ【月と、どこまでも】",q:"きっと、また会えるよ"},
{r:"SR",n:"ルナ【風の音】",q:"……なんか、落ち着く"},
{r:"SR",n:"ルナ【お勉強中】",q:"……やればできる、たぶん"},
{r:"R",n:"ルナ【夜さんぽ】",q:"月、きれいじゃん"},
{r:"R",n:"ルナ【ネコ発見】",q:"……いた"},
{r:"N",n:"ルナ【ねむい】",q:"……あと5分……"},
{r:"N",n:"ルナ【通常運転】",q:"まあ、なんとかなるっしょ"}];
const weights=[["UR",1],["SSR",5],["SR",14],["R",30],["N",50]];
const order=["N","R","SR","SSR","UR"];
const owned={N:new Set(),R:new Set(),SR:new Set(),SSR:new Set(),UR:new Set()};
let stones=100,totalPulls=0,history=[];
const $=id=>document.getElementById(id);
function baseRarity(){let x=Math.random()*100;for(const [r,w] of weights){x-=w;if(x<0)return r}return"N"}
function pick(r){const a=pool.filter(x=>x.r===r);return a[Math.floor(Math.random()*a.length)]}
function draw(){return pick(baseRarity())}
function rank(r){return order.indexOf(r)}
function stageClass(r){return "stage "+(r==="N"?"":"r"+r)}
function resetStage(){ $("stage").className="stage"; $("moon").style.transform="" }
function use(n){if(stones<n){$("message").textContent="月晶石が足りない……";return false}stones-=n;$("stone").textContent=stones;return true}
function updateBook(){$("rarities").innerHTML=order.map(r=>'<div class="badge"><b>'+owned[r].size+'</b>'+r+'<br>所持</div>').join("")}
function addHistory(list){history.unshift(...list);history=history.slice(0,12);$("history").innerHTML=history.map((c,i)=>(i+1)+"． <b>"+c.r+"</b> "+c.n).join("<br>")}
function stageEffect(r){const st=$("stage");st.className=stageClass(r)+" flash";if(r!=="N")st.classList.add("shake");$("hint").textContent=r==="UR"?"月が、あなたを選んだ。":r==="SSR"?"いつもより強い光が、夜を染める。":r==="SR"?"少しだけ、特別な風が吹いた。":"召喚結果を確認……"}
function showOverlay(text,sub){$("summonText").innerHTML="<b>"+text+"</b><small>"+sub+"</small>";$("overlay").classList.add("show");setTimeout(()=>$("overlay").classList.remove("show"),950)}
function onePull(){if(!use(10))return;totalPulls++;$("pulls").textContent="召喚回数："+totalPulls;const c=draw();owned[c.r].add(c.n);addHistory([c]);showOverlay("月が、動いた。","召喚結果を確認しています……");setTimeout(()=>{stageEffect(c.r);$("message").textContent=c.r==="UR"?"――月が、応えた。":c.r+" のルナが現れた。";$("hint").textContent="召喚結果を確認……";updateBook();renderOne(c)},950)}
function renderOne(c){$("tenPanel").classList.remove("show")}
function tenPull(){
if(!use(100))return;
totalPulls+=10;$("pulls").textContent="召喚回数："+totalPulls;
const raw=Array.from({length:10},draw);
const hasHigh=raw.some(c=>["SR","SSR","UR"].includes(c.r));
const preConfirm=hasHigh && Math.random()<.5;
raw.forEach(c=>{c._revealed=false;c._upgradeOnReveal=hasHigh&&!preConfirm&&["SR","SSR","UR"].includes(c.r)});
window.tenResults=raw;
resetStage();
$("tenPanel").classList.remove("show");
$("message").textContent=preConfirm?"――月が、何かを告げている。":"10枚の月が、あなたの前に並ぶ……";
$("hint").textContent=preConfirm?"高レアの存在を感じる……":"……まだ、何が眠っているか分からない。";

if(preConfirm){
 const best=["UR","SSR","SR"].find(r=>raw.some(c=>c.r===r));
 $("stage").className=stageClass(best)+" flash shake";
 $("message").textContent=best==="UR"?"🌕 UR確定――！！":best==="SSR"?"✨ SSR以上、確定――！":"💫 SR以上、確定――！";
 $("hint").textContent=best==="UR"?"月が、あなたを選んだ。":best==="SSR"?"いつもより強い光が、夜を染める。":"少しだけ、特別な風が吹いた。";
 showOverlay($("message").textContent,$("hint").textContent);
 setTimeout(showTenCards,1000);
}else setTimeout(showTenCards,550);
}
function showTenCards(){
  $("tenPanel").classList.add("show");
  $("hint").textContent="🎴 1枚ずつめくって、結果を確かめよう。";
  // Every card is a single native button. No overlay and no nested tap target.
  document.querySelectorAll(".miniCard").forEach((el)=>{
    el.onclick=null;
    el.onclick=()=>revealCard(Number(el.dataset.index));
  });
}
function backHTML(){
  return '<div class="cardBack"><div class="backMoon">🌙</div><div class="backLabel">タップして開封</div></div>';
}
function cardHTML(c){
  return '<div class="cardFront"><div class="miniArt"></div><div class="miniR">★ '+c.r+'</div><div class="miniName">'+c.n+'</div></div>';
}
function revealCard(i){
  const el=document.querySelector('.miniCard[data-index="'+i+'"]');
  const c=window.tenResults?.[i];
  if(!el||!c||c._revealed)return;
  c._revealed=true;

  const shouldUpgrade=!!c._upgradeOnReveal;

  if(shouldUpgrade){
    // Reveal as the lower rank first, then replace the entire button content.
    const apparent=pick(order[Math.max(0,rank(c.r)-1)]);
    el.innerHTML=cardHTML(apparent);
    el.classList.add("open");

    setTimeout(()=>{
      $("message").textContent=apparent.r+" → "+c.r+" に昇格！";
      $("hint").textContent="✨ このカード、本当の姿を見せる……";
      el.classList.add("promoted");

      setTimeout(()=>{
        el.innerHTML=cardHTML(c);
        el.classList.add("r"+c.r);
      },500);
    },300);
  }else{
    el.innerHTML=cardHTML(c);
    el.classList.add("open");
    $("message").textContent=c.r+" のルナが現れた。";
    $("hint").textContent=i===9?"10枚すべて確認！":"次のカードを開いてみよう。";
  }

  owned[c.r].add(c.n);
  addHistory([c]);
  updateBook();

  if(i===9)setTimeout(()=>{
    const best=["UR","SSR","SR","R","N"].find(r=>window.tenResults.some(x=>x.r===r));
    stageEffect(best);
    $("message").textContent=best==="UR"?"――月が、応えた。":best==="SSR"?"✨ SSRが入っていた！":"10連の結果を確認した。";
    $("hint").textContent="全部開封完了。";
  },1250);
}

// Build the cards as plain native buttons.
// Nothing is positioned over them, so Safari has only one tap target per card.
const buildCards=()=>{
  $("cardsGrid").innerHTML=window.tenResults.map((c,i)=>
    '<button class="miniCard" type="button" data-index="'+i+'">'+backHTML()+'<div class="upgrade"><span>✨ 昇格！</span></div></button>'
  ).join("");
};

// Wrap the existing ten-pull so cards are built immediately after results are generated.
const tenPullImpl=tenPull;
tenPull=function(){
  if(stones<100){$("message").textContent="月晶石が足りない……";return}
  tenPullImpl();
  if(window.tenResults)buildCards();
};

$("one").onclick=onePull;
$("ten").onclick=tenPull;
$("recharge").onclick=()=>{stones+=100;$("stone").textContent=stones;$("message").textContent="月晶石を補充した。"};
updateBook();
</script>
</body>
</html>
